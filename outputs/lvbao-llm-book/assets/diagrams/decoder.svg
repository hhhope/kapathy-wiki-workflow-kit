<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img"><title>生成式LLM：一枚token走过的路径</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4b6584"/></marker></defs><rect width="1000" height="760" fill="#fafbfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="47" font-size="26" font-weight="700">生成式LLM：一枚token走过的路径</text><path d="M240 182 L240 230" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M240 312 L240 360" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M240 442 L240 490" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M420 531 L590 531" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><text x="513.0" y="523.0" font-size="15" fill="#556">分数→选择</text><path d="M760 490 L760 220" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><text x="768.0" y="347.0" font-size="15" fill="#556">重复生成</text><path d="M760 220 L420 140" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><text x="598.0" y="172.0" font-size="15" fill="#556">接回前缀</text><rect x="60" y="100" width="360" height="82" rx="10" fill="#e5edff" stroke="#a8b6c9"/><text x="240.0" y="132" text-anchor="middle" font-size="21" font-weight="600">文字 → Tokenizer → ID</text><text x="240.0" y="159" text-anchor="middle" font-size="16">示意：今天 / 天气 / 很 → [7,12,5]</text><rect x="60" y="230" width="360" height="82" rx="10" fill="#e5edff" stroke="#a8b6c9"/><text x="240.0" y="262" text-anchor="middle" font-size="21" font-weight="600">Embedding ＋ 位置信息</text><text x="240.0" y="289" text-anchor="middle" font-size="16">3个位置 × 每个位置d维</text><rect x="60" y="360" width="360" height="82" rx="10" fill="#e2f3eb" stroke="#a8b6c9"/><text x="240.0" y="392" text-anchor="middle" font-size="21" font-weight="600">Transformer块 × N层</text><text x="240.0" y="419" text-anchor="middle" font-size="16">上下文表示：形状仍是3×d</text><rect x="60" y="490" width="360" height="82" rx="10" fill="#fff0dc" stroke="#a8b6c9"/><text x="240.0" y="522" text-anchor="middle" font-size="21" font-weight="600">输出投影 → logits → softmax</text><text x="240.0" y="549" text-anchor="middle" font-size="16">最后位置：d维 → V个词表候选</text><rect x="590" y="490" width="340" height="82" rx="10" fill="#fff0dc" stroke="#a8b6c9"/><text x="760.0" y="522" text-anchor="middle" font-size="21" font-weight="600">选择下一个token</text><text x="760.0" y="549" text-anchor="middle" font-size="16">例如：好 → 接回原来的输入</text><rect x="590" y="100" width="340" height="82" rx="10" fill="#e2f3eb" stroke="#a8b6c9"/><text x="760.0" y="132" text-anchor="middle" font-size="21" font-weight="600">训练时另有目标token</text><text x="760.0" y="159" text-anchor="middle" font-size="16">计算损失 → 反向传播 → 更新权重</text><text x="35" y="720" font-size="17" fill="#556">实线：前向数据流。训练多了求损失与更新；常规生成不每次更新权重。</text></g></svg>