<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" class="atlas-interactive-svg" style="width:100%;height:auto;display:block"><style>.atlas-diagram-node{cursor:pointer;outline:none}.atlas-diagram-node rect{transition:stroke .3s,fill .3s}.atlas-diagram-node:hover rect,.atlas-diagram-node:focus rect{stroke:#c8b7ff;stroke-width:2.5}.atlas-diagram-node.is-selected rect{fill:#3c2d60;stroke:#c4acff;stroke-width:2.5;filter:drop-shadow(0 0 9px #986dff55)}path[marker-end]{stroke-dasharray:10 6;animation:atlas-edge 3s linear infinite}@keyframes atlas-edge{to{stroke-dashoffset:-64}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><title>一个常见的Pre-Norm decoder块（从上往下读）</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9d8de0" /></marker></defs><rect width="1000" height="760" fill="#0d1223" /><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="47" font-size="26" font-weight="700" fill="#d8e2fa">一个常见的Pre-Norm decoder块（从上往下读）</text><path d="M500 172 L500 210" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#arr)" /><path d="M500 292 L500 340" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#arr)" /><path d="M500 422 L500 470" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#arr)" /><path d="M500 552 L500 600" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#arr)" /><path d="M180 130 L180 380" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#arr)" /><text x="188.0" y="247.0" font-size="15" fill="#d8e2fa">原输入旁路</text><path d="M180 380 L290 380" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#arr)" /><text x="243.0" y="372.0" font-size="15" fill="#d8e2fa">＋</text><path d="M820 380 L820 640" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#arr)" /><text x="828.0" y="502.0" font-size="15" fill="#d8e2fa">第二条旁路</text><path d="M820 640 L710 640" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#arr)" /><text x="773.0" y="632.0" font-size="15" fill="#d8e2fa">＋</text><path d="M290 130 L180 130" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#arr)" /><path d="M710 380 L820 380" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#arr)" /><g class="atlas-diagram-node" data-node="0" tabindex="0" role="button" aria-label="输入 X；T×d：T个位置，每个d维"><rect x="290" y="90" width="420" height="82" rx="10" fill="#202746" stroke="#7770a9" stroke-width="1.2" /><text x="500.0" y="122" text-anchor="middle" font-size="21" font-weight="600" fill="#d8e2fa">输入 X</text><text x="500.0" y="149" text-anchor="middle" font-size="16" fill="#d8e2fa">T×d：T个位置，每个d维</text></g><g class="atlas-diagram-node" data-node="1" tabindex="0" role="button" aria-label="归一化 → 因果多头自注意力；只能聚合当前位置及以前的信息"><rect x="290" y="210" width="420" height="82" rx="10" fill="#163b40" stroke="#7770a9" stroke-width="1.2" /><text x="500.0" y="242" text-anchor="middle" font-size="21" font-weight="600" fill="#d8e2fa">归一化 → 因果多头自注意力</text><text x="500.0" y="269" text-anchor="middle" font-size="16" fill="#d8e2fa">只能聚合当前位置及以前的信息</text></g><g class="atlas-diagram-node" data-node="2" tabindex="0" role="button" aria-label="残差相加：X＋Attention输出；旁路把原输入加回来"><rect x="290" y="340" width="420" height="82" rx="10" fill="#34253d" stroke="#7770a9" stroke-width="1.2" /><text x="500.0" y="372" text-anchor="middle" font-size="21" font-weight="600" fill="#d8e2fa">残差相加：X＋Attention输出</text><text x="500.0" y="399" text-anchor="middle" font-size="16" fill="#d8e2fa">旁路把原输入加回来</text></g><g class="atlas-diagram-node" data-node="3" tabindex="0" role="button" aria-label="归一化 → 前馈网络 FFN；逐位置加工；内部可先扩维再投回d"><rect x="290" y="470" width="420" height="82" rx="10" fill="#163b40" stroke="#7770a9" stroke-width="1.2" /><text x="500.0" y="502" text-anchor="middle" font-size="21" font-weight="600" fill="#d8e2fa">归一化 → 前馈网络 FFN</text><text x="500.0" y="529" text-anchor="middle" font-size="16" fill="#d8e2fa">逐位置加工；内部可先扩维再投回d</text></g><g class="atlas-diagram-node" data-node="4" tabindex="0" role="button" aria-label="第二次残差相加 → 输出；仍是T×d，送进下一个块"><rect x="290" y="600" width="420" height="82" rx="10" fill="#34253d" stroke="#7770a9" stroke-width="1.2" /><text x="500.0" y="632" text-anchor="middle" font-size="21" font-weight="600" fill="#d8e2fa">第二次残差相加 → 输出</text><text x="500.0" y="659" text-anchor="middle" font-size="16" fill="#d8e2fa">仍是T×d，送进下一个块</text></g><text x="35" y="720" font-size="17" fill="#d8e2fa">教学简化：现代模型有不同归一化与位置方案；这不是2017原始编码器—解码器原图。</text></g></svg>