version: 1
authority: requirements-readiness
independent_from:
  - wiki/config/frontmatter-taxonomy.yaml

domains:
  - id: account
    label: account
    aliases:
      - 账户
      - 账户域
      - 账户体系
    description: Account lifecycle, account operation, and account-facing requirement material.
  - id: settlement
    label: settlement
    aliases:
      - 结算
      - 结算域
      - 结算体系
    description: Settlement processing, settlement operations, and settlement-facing requirement material.
  - id: clearing
    label: clearing
    aliases:
      - 清分
      - 清分域
      - 清分体系
    description: Clearing flows, clearing operations, and clearing-facing requirement material.
  - id: merchant_platform_relationship
    label: merchant platform relationship
    aliases:
      - 商户与平台关系
      - 商户平台关系
      - 商户
      - 平台
      - 服务方
      - 服务商
      - 入驻
      - 资质
      - 能力开通
    description: Merchant, platform, service-provider identity, onboarding, qualification, capability enablement, and platform responsibility boundaries.
  - id: payment_transaction
    label: payment transaction
    aliases:
      - 支付交易
      - 支付订单
      - 支付方式
      - 授权
      - 扣款
      - 退款
      - 拒付
      - 支付状态
      - 失败重试
    description: Payment order lifecycle, payment method use, authorization, debit, refund, dispute, status, and retry semantics.
  - id: billing_revenue
    label: billing revenue
    aliases:
      - 计费与收入
      - 计费
      - 收入
      - 订阅
      - 套餐
      - 价格
      - 用量
      - 席位
      - 账单
      - 催缴
      - 宽限期
      - 收入恢复
      - 发票
    description: Pricing, subscription lifecycle, usage billing, seat billing, invoice, dunning, grace-period, retention, and revenue-recovery rules.
  - id: account_balance
    label: account balance
    aliases:
      - 账户与余额
      - 账户余额
      - 支付账户
      - 钱包
      - 余额
      - 资金归属
      - 可用资金
      - 在途资金
      - 冻结资金
      - 账本视图
    description: Payment account, wallet, balance, ownership, available funds, pending funds, reserved funds, and ledger-view semantics.
  - id: funds_movement_settlement
    label: funds movement settlement
    aliases:
      - 资金流转与结算
      - 资金流转
      - transfer
      - payout
      - 提现
      - 出款
      - 分账
      - 结算批次
      - 结算周期
      - 平台费
      - 收款方结算
    description: Transfer, payout, withdrawal, split settlement, settlement batch, settlement cycle, platform fee, and receiver-settlement movement rules.
  - id: financial_operations
    label: financial operations
    aliases:
      - 财务运营
      - 清分证据
      - 对账
      - 报表
      - 费用核算
      - 差错处理
      - 财务关账
      - 运营审计
    description: Clearing evidence, reconciliation, reporting, fee accounting, exception handling, financial close support, and auditability.
  - id: risk_compliance
    label: risk compliance
    aliases:
      - 风险与合规
      - 风控
      - 合规
      - KYC
      - KYB
      - AML
      - 欺诈
      - 交易监控
      - 自动扣款授权
      - 消费者保护
      - 税务合规
    description: KYC, KYB, AML, fraud, transaction monitoring, authorization constraints, consumer protection, and tax compliance decisions.
  - id: embedded_financial_products
    label: embedded financial products
    aliases:
      - 嵌入式金融产品
      - 发卡
      - issuing
      - treasury
      - capital
      - spend
      - BaaS
      - Banking as a Service
    description: Issuing, treasury, capital, spend, and BaaS requirements when financial product scope is explicit.

roles:
  categories:
    business_actors:
      description: People or organizations whose business outcome is represented by the requirement.
    operation_owners:
      description: Business or operational owners accountable for process execution and controls.
    system_actors:
      description: Systems or automated participants that perform or receive requirement actions.
    delivery_owners:
      description: Product, engineering, and quality owners accountable for delivery and verification.
  vocabulary:
    retail_operations:
      label: retail operations
      aliases:
        - 零售运营
      category: operation_owners
    financial_operations:
      label: financial operations
      aliases:
        - 金融运营
      category: operation_owners
    product:
      label: product
      aliases:
        - 产品
      category: delivery_owners
    finance:
      label: finance
      aliases:
        - 财务
      category: operation_owners
    clearing:
      label: clearing
      aliases:
        - 清算
        - 清分
      category: operation_owners
    compliance:
      label: compliance
      aliases:
        - 合规
      category: operation_owners
    retail_customer:
      label: retail customer
      aliases:
        - 零售客户
      category: business_actors
    financial_customer:
      label: financial customer
      aliases:
        - 金融客户
      category: business_actors
    system_actor:
      label: system actor
      aliases:
        - 系统
        - 外部系统
        - 内部系统
      category: system_actors
    engineering:
      label: engineering
      aliases:
        - 研发
        - 技术
      category: delivery_owners
    qa:
      label: QA
      aliases:
        - 测试
        - 质量
      category: delivery_owners
    risk_control:
      label: risk control
      aliases:
        - 风控
        - 风险控制
      category: operation_owners

hard_gate_fields:
  domain:
    label: domain
    description: Confirmed requirement domain from this taxonomy.
  roles:
    label: roles
    description: Explicit requirement actors and owners using the role vocabulary.
  user_stories:
    label: user stories
    description: User- or actor-centered requirement statements.
  acceptance_functions:
    label: acceptance functions
    description: Traceable acceptance checks mapped back to user stories.

soft_evidence_categories:
  business_rules:
    label: business rules
    classification: soft_warning
    description: Business constraints that may need design follow-up but are not first-version hard gate fields.
  exception_scenarios:
    label: exception scenarios
    classification: soft_warning
    description: Edge cases, reversals, failures, and manual recovery paths for design follow-up.
  api:
    label: API
    classification: design_evidence
    description: Interface evidence that supports later design validation.
  ddl:
    label: DDL
    classification: design_evidence
    description: Database schema evidence that supports later design validation.
  adr:
    label: ADR
    classification: design_evidence
    description: Decision records or decision candidates that inform later design.
  test_plan:
    label: test plan
    classification: design_evidence
    description: Verification planning evidence outside the first-version hard gate.
  release_plan:
    label: release plan
    classification: design_evidence
    description: Rollout and release planning evidence outside the first-version hard gate.
