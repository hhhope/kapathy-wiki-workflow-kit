<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">账户组系统架构重绘</title>
  <desc id="desc">基于多渠道收款和宝财通架构图重绘的分层系统架构。</desc>
  <defs>
    <style>
      @font-face{font-family:YaHeiLocal;src:url("file:///mnt/c/Windows/Fonts/msyh.ttc") format("truetype")}.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#111827;stroke-width:3}.lane{fill:#eef2ff;stroke:#111827;stroke-width:2.5}.service{fill:#ecfdf5;stroke:#111827;stroke-width:2}.account{fill:#fff7ed;stroke:#111827;stroke-width:2}.data{fill:#f5f3ff;stroke:#111827;stroke-width:2}.ext{fill:#eff6ff;stroke:#111827;stroke-width:2}.ops{fill:#fef2f2;stroke:#111827;stroke-width:2}.title{font:800 38px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#111827}.sub{font:600 17px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#64748b}.lt{font:800 24px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#111827}.txt{font:700 18px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#111827}.small{font:600 14px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#475569}.vlabel{font:800 24px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#111827;writing-mode:tb}.arrow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#ef4444;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrowRed)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L12 4.5L0 9Z" fill="#334155"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L12 4.5L0 9Z" fill="#ef4444"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1040"/>
  <text x="58" y="70" class="title">账户组系统架构：入口、产品、服务、数据、通道、银行</text>
  <text x="58" y="106" class="sub">从《账户组技术现状分享》多渠道收款/宝财通架构重绘：新人先看层，再看对象落在哪个层。</text>

  <rect class="panel" x="42" y="135" width="1516" height="835" rx="26"/>
  <rect class="ops" x="1400" y="180" width="110" height="700" rx="22"/>
  <text class="vlabel" x="1448" y="420">运营管理 AD / BM</text>

  <g>
    <rect class="lane" x="104" y="170" width="1240" height="90" rx="18"/>
    <text class="lt" x="128" y="205">网关层 / 上游入口</text>
    <rect class="ext" x="370" y="192" width="170" height="44" rx="10"/><text class="txt" x="455" y="221" text-anchor="middle">宝付 BM</text>
    <rect class="ext" x="570" y="192" width="170" height="44" rx="10"/><text class="txt" x="655" y="221" text-anchor="middle">API</text>
    <rect class="ext" x="770" y="192" width="170" height="44" rx="10"/><text class="txt" x="855" y="221" text-anchor="middle">H5</text>
    <rect class="ext" x="970" y="192" width="240" height="44" rx="10"/><text class="txt" x="1090" y="221" text-anchor="middle">商户直客 / 产品入口</text>
  </g>

  <g>
    <rect class="lane" x="104" y="292" width="1240" height="145" rx="18"/>
    <text class="lt" x="128" y="327">产品层</text>
    <rect class="ext" x="255" y="330" width="230" height="72" rx="16"/><text class="txt" x="370" y="359" text-anchor="middle">多渠道收款</text><text class="small" x="370" y="384" text-anchor="middle">收款 / 担保 / 组合 / 代付</text>
    <rect class="ext" x="520" y="330" width="230" height="72" rx="16"/><text class="txt" x="635" y="359" text-anchor="middle">宝财通</text><text class="small" x="635" y="384" text-anchor="middle">支付分账户 + 账户产品</text>
    <rect class="ext" x="785" y="330" width="230" height="72" rx="16"/><text class="txt" x="900" y="359" text-anchor="middle">宝户通</text><text class="small" x="900" y="384" text-anchor="middle">会员 / 开户 / 提现 / 分账</text>
    <rect class="ext" x="1050" y="330" width="210" height="72" rx="16"/><text class="txt" x="1155" y="359" text-anchor="middle">银企云 / 银企通</text><text class="small" x="1155" y="384" text-anchor="middle">银行账户连接</text>
  </g>

  <g>
    <rect class="lane" x="104" y="468" width="1240" height="282" rx="18"/>
    <text class="lt" x="128" y="503">服务层</text>
    <rect class="service" x="160" y="535" width="165" height="150" rx="16"/><text class="txt" x="242" y="566" text-anchor="middle">基础服务</text><text class="small" x="242" y="597" text-anchor="middle">四要素 / 黑名单</text><text class="small" x="242" y="625" text-anchor="middle">企业状态 / 认证</text>
    <rect class="service" x="355" y="535" width="165" height="150" rx="16"/><text class="txt" x="437" y="566" text-anchor="middle">会员系统</text><text class="small" x="437" y="597" text-anchor="middle">会员管理</text><text class="small" x="437" y="625" text-anchor="middle">产品配置 / 额度</text>
    <rect class="service" x="550" y="535" width="220" height="150" rx="16"/><text class="txt" x="660" y="566" text-anchor="middle">交易系统</text><text class="small" x="660" y="597" text-anchor="middle">收款：担保 / 组合</text><text class="small" x="660" y="625" text-anchor="middle">付款：代付 / 转账</text>
    <rect class="account" x="800" y="535" width="220" height="150" rx="16"/><text class="txt" x="910" y="566" text-anchor="middle">清算系统</text><text class="small" x="910" y="597" text-anchor="middle">费率 / 计费 / 清算</text><text class="small" x="910" y="625" text-anchor="middle">对账 / 会计 / 账务</text>
    <rect class="account" x="1050" y="535" width="220" height="150" rx="16"/><text class="txt" x="1160" y="566" text-anchor="middle">账户记账</text><text class="small" x="1160" y="597" text-anchor="middle">个人用户 / 企业用户</text><text class="small" x="1160" y="625" text-anchor="middle">账本 / 余额 / 账户关系</text>
    <rect class="ops" x="550" y="700" width="220" height="38" rx="12"/><text class="txt" x="660" y="725" text-anchor="middle">风控系统</text>
    <rect class="ops" x="800" y="700" width="220" height="38" rx="12"/><text class="txt" x="910" y="725" text-anchor="middle">退款中心</text>
    <rect class="ops" x="1050" y="700" width="220" height="38" rx="12"/><text class="txt" x="1160" y="725" text-anchor="middle">代理商 / 分润</text>
  </g>

  <g>
    <rect class="lane" x="104" y="775" width="1240" height="86" rx="18"/>
    <text class="lt" x="128" y="828">数据层</text>
    <rect class="data" x="280" y="798" width="130" height="42" rx="10"/><text class="txt" x="345" y="826" text-anchor="middle">商户数据</text>
    <rect class="data" x="435" y="798" width="130" height="42" rx="10"/><text class="txt" x="500" y="826" text-anchor="middle">用户数据</text>
    <rect class="data" x="590" y="798" width="130" height="42" rx="10"/><text class="txt" x="655" y="826" text-anchor="middle">支付数据</text>
    <rect class="data" x="745" y="798" width="130" height="42" rx="10"/><text class="txt" x="810" y="826" text-anchor="middle">渠道数据</text>
    <rect class="data" x="900" y="798" width="130" height="42" rx="10"/><text class="txt" x="965" y="826" text-anchor="middle">财务数据</text>
    <rect class="data" x="1055" y="798" width="130" height="42" rx="10"/><text class="txt" x="1120" y="826" text-anchor="middle">风控数据</text>
  </g>

  <g>
    <rect class="lane" x="104" y="890" width="1240" height="70" rx="18"/>
    <text class="lt" x="128" y="934">支付渠道 / 合作银行</text>
    <rect class="ext" x="430" y="906" width="120" height="38" rx="10"/><text class="txt" x="490" y="931" text-anchor="middle">银联</text>
    <rect class="ext" x="575" y="906" width="120" height="38" rx="10"/><text class="txt" x="635" y="931" text-anchor="middle">网联</text>
    <rect class="ext" x="720" y="906" width="150" height="38" rx="10"/><text class="txt" x="795" y="931" text-anchor="middle">自有支付渠道</text>
    <rect class="ext" x="895" y="906" width="120" height="38" rx="10"/><text class="txt" x="955" y="931" text-anchor="middle">银企通</text>
    <rect class="ext" x="1040" y="906" width="120" height="38" rx="10"/><text class="txt" x="1100" y="931" text-anchor="middle">合作银行</text>
  </g>

  <path class="arrow" d="M724 260V292"/>
  <path class="arrow" d="M724 437V468"/>
  <path class="arrow" d="M910 685V775"/>
  <path class="arrow" d="M910 861V890"/>
  <path class="dash" d="M1344 530 C1370 530 1372 530 1400 530"/>
  <path class="dash" d="M1400 650 C1368 650 1355 650 1270 650"/>
  <text class="small" x="860" y="505">账户组重点：账户关系、账务、余额、清结算、对账、报表、通道回执</text>
</svg>
