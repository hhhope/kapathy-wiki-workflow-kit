<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1300" role="img"><title>RAG：先找证据，再组织回答</title><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59718a"/></marker></defs><rect width="1080" height="1300" fill="#fafbfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="48" font-size="27" font-weight="700">RAG：先找证据，再组织回答</text><text x="35" y="82" font-size="17" fill="#64748b">先看每个部件，再沿标注箭头读依赖；布局位置不表示所有部件串行执行。</text><path d="M540 230V310" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="275.0" font-size="16" fill="#43586d">查询</text><path d="M750 525H810V355H750" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="760" y="510" font-size="16" fill="#43586d">候选来源</text><path d="M330 355H120V695H330" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="128" y="380" font-size="16" fill="#43586d">取回片段</text><path d="M540 740V820" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="785.0" font-size="16" fill="#43586d">筛选后上下文</text><path d="M330 185H162V865H330" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="170" y="210" font-size="16" fill="#43586d">原始问题</text><path d="M540 910V990" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="955.0" font-size="16" fill="#43586d">组织回答</text><rect x="330" y="140" width="420" height="90" rx="12" fill="#e6eefb" stroke="#aab9cb"/><text x="540" y="193" text-anchor="middle" font-size="23" font-weight="600">用户问题</text><rect x="330" y="310" width="420" height="90" rx="12" fill="#e2f2e9" stroke="#aab9cb"/><text x="540" y="363" text-anchor="middle" font-size="23" font-weight="600">检索器</text><rect x="330" y="480" width="420" height="90" rx="12" fill="#fff0da" stroke="#aab9cb"/><text x="540" y="533" text-anchor="middle" font-size="23" font-weight="600">文档库与向量索引</text><rect x="330" y="650" width="420" height="90" rx="12" fill="#e6eefb" stroke="#aab9cb"/><text x="540" y="703" text-anchor="middle" font-size="23" font-weight="600">候选片段＋版本核验</text><rect x="330" y="820" width="420" height="90" rx="12" fill="#e2f2e9" stroke="#aab9cb"/><text x="540" y="873" text-anchor="middle" font-size="23" font-weight="600">问题＋有效证据 → LLM</text><rect x="330" y="990" width="420" height="90" rx="12" fill="#fff0da" stroke="#aab9cb"/><text x="540" y="1043" text-anchor="middle" font-size="23" font-weight="600">回答＋可核对引用</text><text x="35" y="1210" font-size="17" fill="#475569">检索找到相关材料不等于材料有效；还要核验版本、对象和是否真正支持结论。</text></g></svg>