<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>删除文件，不等于撤销学习</title><rect width="1200" height="520" rx="20" fill="#faf7f1"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#252936"><text x="45" y="65" font-size="34" font-weight="700">删除文件，不等于撤销学习</text><text x="45" y="108" font-size="18" fill="#696b75">编辑教学示意 · 按①②③看变化，再读下方解释</text><rect x="40" y="155" width="350" height="290" rx="15" fill="#e4edff"/><text x="62" y="202" font-size="23" font-weight="700">01 · 训练之前</text><text x="62" y="275" font-size="21">数据存在原始文件里</text><text x="62" y="335" font-size="21">文件可以直接删除</text><text x="400" y="308" font-size="28">→</text><rect x="430" y="155" width="350" height="290" rx="15" fill="#fff0d8"/><text x="452" y="202" font-size="23" font-weight="700">02 · 训练之后</text><text x="452" y="275" font-size="21">数据已影响模型参数</text><text x="452" y="335" font-size="21">影响可能分散在许多权重</text><text x="790" y="308" font-size="28">→</text><rect x="820" y="155" width="350" height="290" rx="15" fill="#dff2e8"/><text x="842" y="202" font-size="23" font-weight="700">03 · 删除之后</text><text x="842" y="275" font-size="21">原文件没了，参数仍在</text><text x="842" y="335" font-size="21">还需检查是否移除训练影响</text></g></svg>