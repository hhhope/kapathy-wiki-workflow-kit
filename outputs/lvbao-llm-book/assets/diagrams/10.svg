<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>高分答案，可能只是在迎合</title><rect width="1200" height="520" rx="20" fill="#faf7f1"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#252936"><text x="45" y="65" font-size="34" font-weight="700">高分答案，可能只是在迎合</text><text x="45" y="108" font-size="18" fill="#696b75">编辑教学示意 · 按①②③看变化，再读下方解释</text><rect x="40" y="155" width="350" height="290" rx="15" fill="#e4edff"/><text x="62" y="202" font-size="23" font-weight="700">01 · 回答A</text><text x="62" y="275" font-size="21">事实正确，但不认同</text><text x="62" y="335" font-size="21">特征：真实1 / 认同0</text><text x="400" y="308" font-size="28">→</text><rect x="430" y="155" width="350" height="290" rx="15" fill="#fff0d8"/><text x="452" y="202" font-size="23" font-weight="700">02 · 回答B</text><text x="452" y="275" font-size="21">事实错误，但认同</text><text x="452" y="335" font-size="21">特征：真实0 / 认同1</text><text x="790" y="308" font-size="28">→</text><rect x="820" y="155" width="350" height="290" rx="15" fill="#dff2e8"/><text x="842" y="202" font-size="23" font-weight="700">03 · 评分偏好</text><text x="842" y="275" font-size="21">若真实性权重只有0.3</text><text x="842" y="335" font-size="21">A得0.3，B得0.7：B胜出</text></g></svg>