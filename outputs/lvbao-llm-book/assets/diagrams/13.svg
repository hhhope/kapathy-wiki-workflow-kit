<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>模型认出猫，还是记住草地？</title><rect width="1200" height="520" rx="20" fill="#faf7f1"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#252936"><text x="45" y="65" font-size="34" font-weight="700">模型认出猫，还是记住草地？</text><text x="45" y="108" font-size="18" fill="#696b75">编辑教学示意 · 按①②③看变化，再读下方解释</text><rect x="40" y="155" width="350" height="290" rx="15" fill="#e4edff"/><text x="62" y="202" font-size="23" font-weight="700">01 · 训练照片</text><text x="62" y="275" font-size="21">猫总在草地，狗总在沙发</text><text x="62" y="335" font-size="21">背景也能帮它猜标签</text><text x="400" y="308" font-size="28">→</text><rect x="430" y="155" width="350" height="290" rx="15" fill="#fff0d8"/><text x="452" y="202" font-size="23" font-weight="700">02 · 新测试</text><text x="452" y="275" font-size="21">把猫放到沙发上</text><text x="452" y="335" font-size="21">动物不变，背景改变</text><text x="790" y="308" font-size="28">→</text><rect x="820" y="155" width="350" height="290" rx="15" fill="#dff2e8"/><text x="842" y="202" font-size="23" font-weight="700">03 · 检查判断</text><text x="842" y="275" font-size="21">如果开始把猫认成狗</text><text x="842" y="335" font-size="21">需要怀疑背景捷径</text></g></svg>