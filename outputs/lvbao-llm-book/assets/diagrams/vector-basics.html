<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{margin:0}svg{width:100%}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330"><rect width="900" height="330" fill="#f8fafc"/><g font-family="PingFang SC,sans-serif"><text x="30" y="45" font-size="27">一排数 → 按位相乘 → 加起来</text><rect x="35" y="85" width="240" height="150" rx="12" fill="#e5edff"/><text x="60" y="132" font-size="24">u = [1, 2]</text><text x="60" y="182" font-size="24">v = [3, 4]</text><text x="287" y="165" font-size="30">→</text><rect x="335" y="85" width="240" height="150" rx="12" fill="#e1f2e8"/><text x="360" y="132" font-size="24">第1维：1×3=3</text><text x="360" y="182" font-size="24">第2维：2×4=8</text><text x="587" y="165" font-size="30">→</text><rect x="635" y="85" width="230" height="150" rx="12" fill="#fff0dc"/><text x="660" y="132" font-size="24">点积：3＋8</text><text x="660" y="182" font-size="30">= 11</text><text x="35" y="285" font-size="20">两个向量输入，得到一个数字；不是把两排数接长。</text></g></svg>
