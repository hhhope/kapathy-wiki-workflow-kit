<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">账户核心链路重绘</title>
  <desc id="desc">账户组核心链路，从进件开户到对账治理。</desc>
  <defs>
    <style>
      @font-face{font-family:YaHeiLocal;src:url("file:///mnt/c/Windows/Fonts/msyh.ttc") format("truetype")}.bg{fill:#020617}.grid{stroke:#1e293b;stroke-width:1;fill:none}.title{font:800 36px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#f8fafc}.sub{font:600 16px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#94a3b8}.lane{fill:rgba(15,23,42,.86);stroke:#334155;stroke-width:2}.label{font:800 20px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#f8fafc}.box{stroke-width:2.5;rx:14}.b1{fill:rgba(34,211,238,.16);stroke:#22d3ee}.b2{fill:rgba(52,211,153,.16);stroke:#34d399}.b3{fill:rgba(251,191,36,.17);stroke:#fbbf24}.b4{fill:rgba(167,139,250,.17);stroke:#a78bfa}.b5{fill:rgba(251,113,133,.14);stroke:#fb7185}.txt{font:800 18px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#fff}.small{font:600 13px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#cbd5e1}.arrow{fill:none;stroke:#64748b;stroke-width:4;marker-end:url(#arrow)}.proof{fill:#0f172a;stroke:#475569;stroke-width:2}.proofText{font:700 14px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#e2e8f0}
    </style>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path class="grid" d="M42 0H0V42"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L12 4.5L0 9Z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1600" height="860"/><rect width="1600" height="860" fill="url(#grid)" opacity=".65"/>
  <text x="60" y="72" class="title">核心链路：不是流程图，是资金结果责任链</text>
  <text x="60" y="108" class="sub">每一步都要能落到对象、状态、账务、余额、清结算、对账证据。新人排障时先定位链路位置，再取证。</text>

  <rect class="lane" x="52" y="150" width="1496" height="120" rx="22"/><text class="label" x="82" y="218">业务入口</text>
  <rect class="lane" x="52" y="294" width="1496" height="120" rx="22"/><text class="label" x="82" y="362">账户关系</text>
  <rect class="lane" x="52" y="438" width="1496" height="120" rx="22"/><text class="label" x="82" y="506">资金动作</text>
  <rect class="lane" x="52" y="582" width="1496" height="120" rx="22"/><text class="label" x="82" y="650">内部证据</text>

  <g transform="translate(210 172)">
    <rect class="box b1" width="170" height="74"/><text class="txt" x="85" y="32" text-anchor="middle">进件 / 开户</text><text class="small" x="85" y="56" text-anchor="middle">主体、协议、产品准入</text>
  </g>
  <g transform="translate(430 172)">
    <rect class="box b1" width="170" height="74"/><text class="txt" x="85" y="32" text-anchor="middle">入口校验</text><text class="small" x="85" y="56" text-anchor="middle">API / H5 / BM</text>
  </g>
  <g transform="translate(650 172)">
    <rect class="box b1" width="170" height="74"/><text class="txt" x="85" y="32" text-anchor="middle">产品识别</text><text class="small" x="85" y="56" text-anchor="middle">宝财通、宝户通、多渠道</text>
  </g>
  <path class="arrow" d="M380 209H430"/><path class="arrow" d="M600 209H650"/>

  <g transform="translate(260 316)">
    <rect class="box b2" width="190" height="74"/><text class="txt" x="95" y="32" text-anchor="middle">账户模型</text><text class="small" x="95" y="56" text-anchor="middle">个人户、企业户、账户类型</text>
  </g>
  <g transform="translate(500 316)">
    <rect class="box b2" width="190" height="74"/><text class="txt" x="95" y="32" text-anchor="middle">母子账户关系</text><text class="small" x="95" y="56" text-anchor="middle">母实子虚、多账户模型</text>
  </g>
  <g transform="translate(740 316)">
    <rect class="box b2" width="190" height="74"/><text class="txt" x="95" y="32" text-anchor="middle">银行账户关系</text><text class="small" x="95" y="56" text-anchor="middle">电子户、备付金、渠道账户</text>
  </g>
  <path class="arrow" d="M820 246 C840 285 850 295 835 316"/>
  <path class="arrow" d="M450 353H500"/><path class="arrow" d="M690 353H740"/>

  <g transform="translate(260 460)">
    <rect class="box b3" width="170" height="74"/><text class="txt" x="85" y="32" text-anchor="middle">交易 / 收款</text><text class="small" x="85" y="56" text-anchor="middle">担保、组合、协议支付</text>
  </g>
  <g transform="translate(470 460)">
    <rect class="box b3" width="170" height="74"/><text class="txt" x="85" y="32" text-anchor="middle">分账 / 分润</text><text class="small" x="85" y="56" text-anchor="middle">规则、接收户、通知</text>
  </g>
  <g transform="translate(680 460)">
    <rect class="box b3" width="170" height="74"/><text class="txt" x="85" y="32" text-anchor="middle">提现 / 代付</text><text class="small" x="85" y="56" text-anchor="middle">出款、回执、重试</text>
  </g>
  <g transform="translate(890 460)">
    <rect class="box b3" width="170" height="74"/><text class="txt" x="85" y="32" text-anchor="middle">退款 / 退回</text><text class="small" x="85" y="56" text-anchor="middle">原路、结果查询、补偿</text>
  </g>
  <path class="arrow" d="M835 390 C770 430 670 438 345 460"/>
  <path class="arrow" d="M430 497H470"/><path class="arrow" d="M640 497H680"/><path class="arrow" d="M850 497H890"/>

  <g transform="translate(215 604)">
    <rect class="box b4" width="180" height="74"/><text class="txt" x="90" y="32" text-anchor="middle">账务 / 凭证</text><text class="small" x="90" y="56" text-anchor="middle">分录、日切、冲正调账</text>
  </g>
  <g transform="translate(445 604)">
    <rect class="box b4" width="180" height="74"/><text class="txt" x="90" y="32" text-anchor="middle">余额状态</text><text class="small" x="90" y="56" text-anchor="middle">可用、实时、冻结</text>
  </g>
  <g transform="translate(675 604)">
    <rect class="box b4" width="180" height="74"/><text class="txt" x="90" y="32" text-anchor="middle">清算 / 结算</text><text class="small" x="90" y="56" text-anchor="middle">清分、结算、收费</text>
  </g>
  <g transform="translate(905 604)">
    <rect class="box b4" width="180" height="74"/><text class="txt" x="90" y="32" text-anchor="middle">对账 / 报表</text><text class="small" x="90" y="56" text-anchor="middle">渠道、银行、商户、财务</text>
  </g>
  <g transform="translate(1135 604)">
    <rect class="box b5" width="180" height="74"/><text class="txt" x="90" y="32" text-anchor="middle">差错 / 可观测</text><text class="small" x="90" y="56" text-anchor="middle">告警、指标、复盘</text>
  </g>
  <path class="arrow" d="M345 534V604"/><path class="arrow" d="M535 534V604"/><path class="arrow" d="M765 534V604"/><path class="arrow" d="M975 534V604"/>
  <path class="arrow" d="M395 641H445"/><path class="arrow" d="M625 641H675"/><path class="arrow" d="M855 641H905"/><path class="arrow" d="M1085 641H1135"/>

  <g transform="translate(60 740)">
    <rect class="proof" width="1480" height="70" rx="18"/>
    <text class="proofText" x="28" y="30">排障证据顺序：</text>
    <text class="proofText" x="160" y="30">入口参数</text>
    <text class="proofText" x="295" y="30">账户关系</text>
    <text class="proofText" x="430" y="30">交易状态</text>
    <text class="proofText" x="565" y="30">账务分录</text>
    <text class="proofText" x="700" y="30">余额变化</text>
    <text class="proofText" x="835" y="30">清结算结果</text>
    <text class="proofText" x="1005" y="30">渠道/银行回执</text>
    <text class="proofText" x="1190" y="30">对账差异</text>
    <text class="proofText" x="1330" y="30">监控告警</text>
    <text class="small" x="28" y="56">新人能获得的能力：对象建模、链路拆解、账务一致性、清结算差错、联调验证、生产问题定位。</text>
  </g>
</svg>
