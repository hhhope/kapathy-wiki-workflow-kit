<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1300" role="img"><title>贝叶斯：先验乘似然，再归一化</title><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59718a"/></marker></defs><rect width="1080" height="1300" fill="#fafbfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="48" font-size="27" font-weight="700">贝叶斯：先验乘似然，再归一化</text><text x="35" y="82" font-size="17" fill="#64748b">先看每个部件，再沿标注箭头读依赖；布局位置不表示所有部件串行执行。</text><path d="M540 230V310" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="275.0" font-size="16" fill="#43586d">观测前</text><path d="M330 185H120V695H330" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="128" y="210" font-size="16" fill="#43586d">分别考虑</text><path d="M540 570V650" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="615.0" font-size="16" fill="#43586d">证据出现的可能性</text><path d="M330 355H162V865H330" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="170" y="380" font-size="16" fill="#43586d">乘法</text><path d="M540 740V820" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="785.0" font-size="16" fill="#43586d">乘法</text><path d="M540 910V990" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="955.0" font-size="16" fill="#43586d">除以权重总和</text><rect x="330" y="140" width="420" height="90" rx="12" fill="#e6eefb" stroke="#aab9cb"/><text x="540" y="193" text-anchor="middle" font-size="23" font-weight="600">假设H与非H</text><rect x="330" y="310" width="420" height="90" rx="12" fill="#e2f2e9" stroke="#aab9cb"/><text x="540" y="363" text-anchor="middle" font-size="23" font-weight="600">先验概率</text><rect x="330" y="480" width="420" height="90" rx="12" fill="#fff0da" stroke="#aab9cb"/><text x="540" y="533" text-anchor="middle" font-size="23" font-weight="600">新观测证据E</text><rect x="330" y="650" width="420" height="90" rx="12" fill="#e6eefb" stroke="#aab9cb"/><text x="540" y="703" text-anchor="middle" font-size="23" font-weight="600">两假设下的似然</text><rect x="330" y="820" width="420" height="90" rx="12" fill="#e2f2e9" stroke="#aab9cb"/><text x="540" y="873" text-anchor="middle" font-size="23" font-weight="600">未归一化权重</text><rect x="330" y="990" width="420" height="90" rx="12" fill="#fff0da" stroke="#aab9cb"/><text x="540" y="1043" text-anchor="middle" font-size="23" font-weight="600">后验概率</text><text x="35" y="1210" font-size="17" fill="#475569">重复想起同一条旧证据，不等于又获得一条独立的新证据。</text></g></svg>