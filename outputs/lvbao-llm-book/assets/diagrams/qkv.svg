<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img"><title>Q、K、V：每个箭头都对应一次计算</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4b6584"/></marker></defs><rect width="1000" height="760" fill="#fafbfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="47" font-size="26" font-weight="700">Q、K、V：每个箭头都对应一次计算</text><path d="M500 172 L170 230" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M500 172 L500 230" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M500 172 L830 230" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M170 312 L330 380" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M500 312 L500 380" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M395 462 L395 510" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M620 551 L700 551" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><text x="668.0" y="543.0" font-size="15" fill="#556">乘V</text><path d="M830 312 L830 510" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><text x="838.0" y="403.0" font-size="15" fill="#556">内容通路</text><rect x="330" y="90" width="340" height="82" rx="10" fill="#e5edff" stroke="#a8b6c9"/><text x="500.0" y="122" text-anchor="middle" font-size="21" font-weight="600">上下文表示 X</text><text x="500.0" y="149" text-anchor="middle" font-size="16">T×d</text><rect x="40" y="230" width="260" height="82" rx="10" fill="#e2f3eb" stroke="#a8b6c9"/><text x="170.0" y="262" text-anchor="middle" font-size="21" font-weight="600">Q = XWq</text><text x="170.0" y="289" text-anchor="middle" font-size="16">T×dₖ：拿来查询</text><rect x="370" y="230" width="260" height="82" rx="10" fill="#e2f3eb" stroke="#a8b6c9"/><text x="500.0" y="262" text-anchor="middle" font-size="21" font-weight="600">K = XWk</text><text x="500.0" y="289" text-anchor="middle" font-size="16">T×dₖ：参与匹配</text><rect x="700" y="230" width="260" height="82" rx="10" fill="#e2f3eb" stroke="#a8b6c9"/><text x="830.0" y="262" text-anchor="middle" font-size="21" font-weight="600">V = XWv</text><text x="830.0" y="289" text-anchor="middle" font-size="16">T×dᵥ：提供内容</text><rect x="170" y="380" width="450" height="82" rx="10" fill="#fff0dc" stroke="#a8b6c9"/><text x="395.0" y="412" text-anchor="middle" font-size="21" font-weight="600">QKᵀ / √dₖ ＋ 因果mask</text><text x="395.0" y="439" text-anchor="middle" font-size="16">T×T：每个位置对每个位置的分数</text><rect x="170" y="510" width="450" height="82" rx="10" fill="#fff0dc" stroke="#a8b6c9"/><text x="395.0" y="542" text-anchor="middle" font-size="21" font-weight="600">逐行 softmax → 权重 A</text><text x="395.0" y="569" text-anchor="middle" font-size="16">T×T；每行总和为1</text><rect x="700" y="510" width="260" height="82" rx="10" fill="#e5edff" stroke="#a8b6c9"/><text x="830.0" y="542" text-anchor="middle" font-size="21" font-weight="600">输出 AV</text><text x="830.0" y="569" text-anchor="middle" font-size="16">T×dᵥ：加权后的内容</text><text x="35" y="720" font-size="17" fill="#556">单头示意。多头分别计算，再拼接并投影；Q/K/V均来自可学习投影。</text></g></svg>