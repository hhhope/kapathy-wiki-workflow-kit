<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1300" role="img" class="atlas-interactive-svg" style="width:100%;height:auto;display:block"><style>.atlas-diagram-node{cursor:pointer;outline:none}.atlas-diagram-node rect{transition:stroke .3s,fill .3s}.atlas-diagram-node:hover rect,.atlas-diagram-node:focus rect{stroke:#c8b7ff;stroke-width:2.5}.atlas-diagram-node.is-selected rect{fill:#3c2d60;stroke:#c4acff;stroke-width:2.5;filter:drop-shadow(0 0 9px #986dff55)}path[marker-end]{stroke-dasharray:10 6;animation:atlas-edge 3s linear infinite}@keyframes atlas-edge{to{stroke-dashoffset:-64}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><title>训练的反馈回路</title><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59718a" /></marker></defs><rect width="1080" height="1300" fill="#0d1223" /><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="48" font-size="27" font-weight="700" fill="#d8e2fa">训练的反馈回路</text><text x="35" y="82" font-size="17" fill="#d8e2fa">先看每个部件，再沿标注箭头读依赖；布局位置不表示所有部件串行执行。</text><path d="M540 230V310" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="555" y="275.0" font-size="16" fill="#d8e2fa">前向</text><path d="M540 400V480" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="555" y="445.0" font-size="16" fill="#d8e2fa">对照目标</text><path d="M540 570V650" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="555" y="615.0" font-size="16" fill="#d8e2fa">求梯度</text><path d="M540 740V820" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="555" y="785.0" font-size="16" fill="#d8e2fa">梯度</text><path d="M750 865H810V355H750" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="760" y="850" font-size="16" fill="#d8e2fa">新参数</text><path d="M750 1035H852V355H750" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="760" y="1020" font-size="16" fill="#d8e2fa">新输入</text><g class="atlas-diagram-node" data-node="0" tabindex="0" role="button" aria-label="输入样本"><rect x="330" y="140" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="193" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">输入样本</text></g><g class="atlas-diagram-node" data-node="1" tabindex="0" role="button" aria-label="模型预测"><rect x="330" y="310" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="363" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">模型预测</text></g><g class="atlas-diagram-node" data-node="2" tabindex="0" role="button" aria-label="计算损失"><rect x="330" y="480" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="533" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">计算损失</text></g><g class="atlas-diagram-node" data-node="3" tabindex="0" role="button" aria-label="反向传播"><rect x="330" y="650" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="703" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">反向传播</text></g><g class="atlas-diagram-node" data-node="4" tabindex="0" role="button" aria-label="优化器更新"><rect x="330" y="820" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="873" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">优化器更新</text></g><g class="atlas-diagram-node" data-node="5" tabindex="0" role="button" aria-label="下一批样本"><rect x="330" y="990" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="1043" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">下一批样本</text></g><text x="35" y="1210" font-size="17" fill="#d8e2fa">预测→比较→求梯度→更新，哪些环节只算数，哪个环节真的改权重？</text></g></svg>