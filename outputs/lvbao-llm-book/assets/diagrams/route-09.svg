<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1300" role="img"><title>强化学习：动作会改变下次输入</title><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59718a"/></marker></defs><rect width="1080" height="1300" fill="#fafbfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="48" font-size="27" font-weight="700">强化学习：动作会改变下次输入</text><text x="35" y="82" font-size="17" fill="#64748b">先看每个部件，再沿标注箭头读依赖；布局位置不表示所有部件串行执行。</text><path d="M540 230V310" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="275.0" font-size="16" fill="#43586d">观察</text><path d="M540 400V480" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="445.0" font-size="16" fill="#43586d">选择</text><path d="M540 570V650" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="615.0" font-size="16" fill="#43586d">施加动作</text><path d="M540 740V820" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="785.0" font-size="16" fill="#43586d">反馈</text><path d="M750 865H810V185H750" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="760" y="850" font-size="16" fill="#43586d">下一状态</text><path d="M540 910V990" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="955.0" font-size="16" fill="#43586d">回报信号</text><path d="M750 1035H852V355H750" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="760" y="1020" font-size="16" fill="#43586d">调整行为</text><rect x="330" y="140" width="420" height="90" rx="12" fill="#e6eefb" stroke="#aab9cb"/><text x="540" y="193" text-anchor="middle" font-size="23" font-weight="600">环境状态s</text><rect x="330" y="310" width="420" height="90" rx="12" fill="#e2f2e9" stroke="#aab9cb"/><text x="540" y="363" text-anchor="middle" font-size="23" font-weight="600">策略π</text><rect x="330" y="480" width="420" height="90" rx="12" fill="#fff0da" stroke="#aab9cb"/><text x="540" y="533" text-anchor="middle" font-size="23" font-weight="600">动作a</text><rect x="330" y="650" width="420" height="90" rx="12" fill="#e6eefb" stroke="#aab9cb"/><text x="540" y="703" text-anchor="middle" font-size="23" font-weight="600">环境转移</text><rect x="330" y="820" width="420" height="90" rx="12" fill="#e2f2e9" stroke="#aab9cb"/><text x="540" y="873" text-anchor="middle" font-size="23" font-weight="600">奖励r 与新状态</text><rect x="330" y="990" width="420" height="90" rx="12" fill="#fff0da" stroke="#aab9cb"/><text x="540" y="1043" text-anchor="middle" font-size="23" font-weight="600">学习更新策略</text><text x="35" y="1210" font-size="17" fill="#475569">先沿环境循环走一圈，再看学习回路。奖励可延迟，不必每个动作都有即时得分。</text></g></svg>