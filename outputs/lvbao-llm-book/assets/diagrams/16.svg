<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>相似度最高，也可能已经过期</title><rect width="1200" height="520" rx="20" fill="#faf7f1"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#252936"><text x="45" y="65" font-size="34" font-weight="700">相似度最高，也可能已经过期</text><text x="45" y="108" font-size="18" fill="#696b75">编辑教学示意 · 按①②③看变化，再读下方解释</text><rect x="40" y="155" width="350" height="290" rx="15" fill="#e4edff"/><text x="62" y="202" font-size="23" font-weight="700">01 · 检索第一名</text><text x="62" y="275" font-size="21">A：2024旧规则，分数0.95</text><text x="62" y="335" font-size="21">字面很像当前问题</text><text x="400" y="308" font-size="28">→</text><rect x="430" y="155" width="350" height="290" rx="15" fill="#fff0d8"/><text x="452" y="202" font-size="23" font-weight="700">02 · 检索第二名</text><text x="452" y="275" font-size="21">B：2026新规则，分数0.85</text><text x="452" y="335" font-size="21">明确生效并替代A</text><text x="790" y="308" font-size="28">→</text><rect x="820" y="155" width="350" height="290" rx="15" fill="#dff2e8"/><text x="842" y="202" font-size="23" font-weight="700">03 · 核对再回答</text><text x="842" y="275" font-size="21">应采用B，而不是直接抄A</text><text x="842" y="335" font-size="21">还要检查适用对象和生效日期</text></g></svg>