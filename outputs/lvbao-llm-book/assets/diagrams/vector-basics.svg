<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" class="atlas-interactive-svg" style="width:100%;height:auto;display:block"><style>.atlas-diagram-node{cursor:pointer;outline:none}.atlas-diagram-node rect{transition:stroke .3s,fill .3s}.atlas-diagram-node:hover rect,.atlas-diagram-node:focus rect{stroke:#c8b7ff;stroke-width:2.5}.atlas-diagram-node.is-selected rect{fill:#3c2d60;stroke:#c4acff;stroke-width:2.5;filter:drop-shadow(0 0 9px #986dff55)}path[marker-end]{stroke-dasharray:10 6;animation:atlas-edge 3s linear infinite}@keyframes atlas-edge{to{stroke-dashoffset:-64}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect width="900" height="330" fill="#0d1223" /><g font-family="PingFang SC,sans-serif"><text x="30" y="45" font-size="27" fill="#d8e2fa">一排数 → 按位相乘 → 加起来</text><g class="atlas-diagram-node" data-node="0" tabindex="0" role="button" aria-label="u = [1, 2]；v = [3, 4]"><rect x="35" y="85" width="240" height="150" rx="12" fill="#202746" stroke="#7770a9" stroke-width="1.2" /><text x="60" y="132" font-size="24" fill="#d8e2fa">u = [1, 2]</text><text x="60" y="182" font-size="24" fill="#d8e2fa">v = [3, 4]</text></g><text x="287" y="165" font-size="30" fill="#d8e2fa">→</text><g class="atlas-diagram-node" data-node="1" tabindex="0" role="button" aria-label="第1维：1×3=3；第2维：2×4=8"><rect x="335" y="85" width="240" height="150" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="360" y="132" font-size="24" fill="#d8e2fa">第1维：1×3=3</text><text x="360" y="182" font-size="24" fill="#d8e2fa">第2维：2×4=8</text></g><text x="587" y="165" font-size="30" fill="#d8e2fa">→</text><g class="atlas-diagram-node" data-node="2" tabindex="0" role="button" aria-label="点积：3＋8；= 11"><rect x="635" y="85" width="230" height="150" rx="12" fill="#34253d" stroke="#7770a9" stroke-width="1.2" /><text x="660" y="132" font-size="24" fill="#d8e2fa">点积：3＋8</text><text x="660" y="182" font-size="30" fill="#d8e2fa">= 11</text></g><text x="35" y="285" font-size="20" fill="#d8e2fa">两个向量输入，得到一个数字；不是把两排数接长。</text></g></svg>