<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>编号、向量、相似度是三件事</title><rect width="1200" height="520" rx="20" fill="#faf7f1"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#252936"><text x="45" y="65" font-size="34" font-weight="700">编号、向量、相似度是三件事</text><text x="45" y="108" font-size="18" fill="#696b75">编辑教学示意 · 按①②③看变化，再读下方解释</text><rect x="40" y="155" width="350" height="290" rx="15" fill="#e4edff"/><text x="62" y="202" font-size="23" font-weight="700">01 · 编号</text><text x="62" y="275" font-size="21">猫=7，狗=12</text><text x="62" y="335" font-size="21">7和12只是查找标签</text><text x="400" y="308" font-size="28">→</text><rect x="430" y="155" width="350" height="290" rx="15" fill="#fff0d8"/><text x="452" y="202" font-size="23" font-weight="700">02 · 查向量</text><text x="452" y="275" font-size="21">猫[1,0]，狗[1,1]</text><text x="452" y="335" font-size="21">从嵌入表取出两行</text><text x="790" y="308" font-size="28">→</text><rect x="820" y="155" width="350" height="290" rx="15" fill="#dff2e8"/><text x="842" y="202" font-size="23" font-weight="700">03 · 比方向</text><text x="842" y="275" font-size="21">余弦≈0.707</text><text x="842" y="335" font-size="21">比较的是学到的特征</text></g></svg>