<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" class="atlas-interactive-svg" style="width:100%;height:auto;display:block"><style>.atlas-diagram-node{cursor:pointer;outline:none}.atlas-diagram-node rect{transition:stroke .3s,fill .3s}.atlas-diagram-node:hover rect,.atlas-diagram-node:focus rect{stroke:#c8b7ff;stroke-width:2.5}.atlas-diagram-node.is-selected rect{fill:#3c2d60;stroke:#c4acff;stroke-width:2.5;filter:drop-shadow(0 0 9px #986dff55)}path[marker-end]{stroke-dasharray:10 6;animation:atlas-edge 3s linear infinite}@keyframes atlas-edge{to{stroke-dashoffset:-64}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><title>最新一轮，不一定最好</title><rect width="1200" height="520" rx="20" fill="#0d1223" /><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#252936"><text x="45" y="65" font-size="34" font-weight="700" fill="#d8e2fa">最新一轮，不一定最好</text><text x="45" y="108" font-size="18" fill="#d8e2fa">编辑教学示意 · 按①②③看变化，再读下方解释</text><g class="atlas-diagram-node" data-node="0" tabindex="0" role="button" aria-label="01 · 第3轮；验证损失0.65；当前保存的最佳权重"><rect x="40" y="155" width="350" height="290" rx="15" fill="#202746" stroke="#7770a9" stroke-width="1.2" /><text x="62" y="202" font-size="23" font-weight="700" fill="#d8e2fa">01 · 第3轮</text><text x="62" y="275" font-size="21" fill="#d8e2fa">验证损失0.65</text><text x="62" y="335" font-size="21" fill="#d8e2fa">当前保存的最佳权重</text></g><text x="400" y="308" font-size="28" fill="#d8e2fa">→</text><g class="atlas-diagram-node" data-node="1" tabindex="0" role="button" aria-label="02 · 第4、5轮；0.68 → 0.70；连续2轮没有改善"><rect x="430" y="155" width="350" height="290" rx="15" fill="#34253d" stroke="#7770a9" stroke-width="1.2" /><text x="452" y="202" font-size="23" font-weight="700" fill="#d8e2fa">02 · 第4、5轮</text><text x="452" y="275" font-size="21" fill="#d8e2fa">0.68 → 0.70</text><text x="452" y="335" font-size="21" fill="#d8e2fa">连续2轮没有改善</text></g><text x="790" y="308" font-size="28" fill="#d8e2fa">→</text><g class="atlas-diagram-node" data-node="2" tabindex="0" role="button" aria-label="03 · patience=2；第5轮停止，恢复第3轮；停止位置≠选用权重位置"><rect x="820" y="155" width="350" height="290" rx="15" fill="#163b40" stroke="#7770a9" stroke-width="1.2" /><text x="842" y="202" font-size="23" font-weight="700" fill="#d8e2fa">03 · patience=2</text><text x="842" y="275" font-size="21" fill="#d8e2fa">第5轮停止，恢复第3轮</text><text x="842" y="335" font-size="21" fill="#d8e2fa">停止位置≠选用权重位置</text></g></g></svg>