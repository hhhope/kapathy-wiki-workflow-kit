<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" class="atlas-interactive-svg" style="width:100%;height:auto;display:block"><style>.atlas-diagram-node{cursor:pointer;outline:none}.atlas-diagram-node rect{transition:stroke .3s,fill .3s}.atlas-diagram-node:hover rect,.atlas-diagram-node:focus rect{stroke:#c8b7ff;stroke-width:2.5}.atlas-diagram-node.is-selected rect{fill:#3c2d60;stroke:#c4acff;stroke-width:2.5;filter:drop-shadow(0 0 9px #986dff55)}path[marker-end]{stroke-dasharray:10 6;animation:atlas-edge 3s linear infinite}@keyframes atlas-edge{to{stroke-dashoffset:-64}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><title>奖励来得晚，前面步骤怎么计功？</title><rect width="1200" height="520" rx="20" fill="#0d1223" /><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#252936"><text x="45" y="65" font-size="34" font-weight="700" fill="#d8e2fa">奖励来得晚，前面步骤怎么计功？</text><text x="45" y="108" font-size="18" fill="#d8e2fa">编辑教学示意 · 按①②③看变化，再读下方解释</text><g class="atlas-diagram-node" data-node="0" tabindex="0" role="button" aria-label="01 · 动作1；找准杯子位置；当下奖励=0"><rect x="40" y="155" width="350" height="290" rx="15" fill="#202746" stroke="#7770a9" stroke-width="1.2" /><text x="62" y="202" font-size="23" font-weight="700" fill="#d8e2fa">01 · 动作1</text><text x="62" y="275" font-size="21" fill="#d8e2fa">找准杯子位置</text><text x="62" y="335" font-size="21" fill="#d8e2fa">当下奖励=0</text></g><text x="400" y="308" font-size="28" fill="#d8e2fa">→</text><g class="atlas-diagram-node" data-node="1" tabindex="0" role="button" aria-label="02 · 动作2；收紧手指，拿稳杯子；随后奖励=10"><rect x="430" y="155" width="350" height="290" rx="15" fill="#34253d" stroke="#7770a9" stroke-width="1.2" /><text x="452" y="202" font-size="23" font-weight="700" fill="#d8e2fa">02 · 动作2</text><text x="452" y="275" font-size="21" fill="#d8e2fa">收紧手指，拿稳杯子</text><text x="452" y="335" font-size="21" fill="#d8e2fa">随后奖励=10</text></g><text x="790" y="308" font-size="28" fill="#d8e2fa">→</text><g class="atlas-diagram-node" data-node="2" tabindex="0" role="button" aria-label="03 · 回看动作1；若γ=0.9，γ²×10=8.1；未来奖励也能进入当前回报"><rect x="820" y="155" width="350" height="290" rx="15" fill="#163b40" stroke="#7770a9" stroke-width="1.2" /><text x="842" y="202" font-size="23" font-weight="700" fill="#d8e2fa">03 · 回看动作1</text><text x="842" y="275" font-size="21" fill="#d8e2fa">若γ=0.9，γ²×10=8.1</text><text x="842" y="335" font-size="21" fill="#d8e2fa">未来奖励也能进入当前回报</text></g></g></svg>