<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>同样方向，步子太大也会过头</title><rect width="1200" height="520" rx="20" fill="#faf7f1"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#252936"><text x="45" y="65" font-size="34" font-weight="700">同样方向，步子太大也会过头</text><text x="45" y="108" font-size="18" fill="#696b75">编辑教学示意 · 按①②③看变化，再读下方解释</text><rect x="40" y="155" width="350" height="290" rx="15" fill="#e4edff"/><text x="62" y="202" font-size="23" font-weight="700">01 · 起点θ=0</text><text x="62" y="275" font-size="21">目标θ=3；梯度=−6</text><text x="62" y="335" font-size="21">损失(0−3)²=9</text><text x="400" y="308" font-size="28">→</text><rect x="430" y="155" width="350" height="290" rx="15" fill="#fff0d8"/><text x="452" y="202" font-size="23" font-weight="700">02 · 学习率0.1</text><text x="452" y="275" font-size="21">新θ=0−0.1×(−6)=0.6</text><text x="452" y="335" font-size="21">新损失=5.76：靠近目标</text><text x="790" y="308" font-size="28">→</text><rect x="820" y="155" width="350" height="290" rx="15" fill="#dff2e8"/><text x="842" y="202" font-size="23" font-weight="700">03 · 学习率1.1</text><text x="842" y="275" font-size="21">新θ=0−1.1×(−6)=6.6</text><text x="842" y="335" font-size="21">新损失=12.96：跨过目标</text></g></svg>