<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>自回归生成的循环</title><style>body{margin:0;background:#fafbfe}svg{display:block;width:100%;max-width:1080px;margin:auto}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1300" role="img"><title>自回归生成的循环</title><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59718a"/></marker></defs><rect width="1080" height="1300" fill="#fafbfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="48" font-size="27" font-weight="700">自回归生成的循环</text><text x="35" y="82" font-size="17" fill="#64748b">先看每个部件，再沿标注箭头读依赖；布局位置不表示所有部件串行执行。</text><path d="M540 230V310" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="275.0" font-size="16" fill="#43586d">输入</text><path d="M540 400V480" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="445.0" font-size="16" fill="#43586d">最后位置投影</text><path d="M540 570V650" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="615.0" font-size="16" fill="#43586d">温度等规则</text><path d="M540 740V820" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="785.0" font-size="16" fill="#43586d">选取</text><path d="M540 910V990" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="955.0" font-size="16" fill="#43586d">新增内容</text><path d="M750 1035H810V185H750" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="760" y="1020" font-size="16" fill="#43586d">重复，直到停止</text><rect x="330" y="140" width="420" height="90" rx="12" fill="#e6eefb" stroke="#aab9cb"/><text x="540" y="193" text-anchor="middle" font-size="23" font-weight="600">当前token前缀</text><rect x="330" y="310" width="420" height="90" rx="12" fill="#e2f2e9" stroke="#aab9cb"/><text x="540" y="363" text-anchor="middle" font-size="23" font-weight="600">Transformer</text><rect x="330" y="480" width="420" height="90" rx="12" fill="#fff0da" stroke="#aab9cb"/><text x="540" y="533" text-anchor="middle" font-size="23" font-weight="600">词表logits</text><rect x="330" y="650" width="420" height="90" rx="12" fill="#e6eefb" stroke="#aab9cb"/><text x="540" y="703" text-anchor="middle" font-size="23" font-weight="600">softmax / 解码</text><rect x="330" y="820" width="420" height="90" rx="12" fill="#e2f2e9" stroke="#aab9cb"/><text x="540" y="873" text-anchor="middle" font-size="23" font-weight="600">选出一个token</text><rect x="330" y="990" width="420" height="90" rx="12" fill="#fff0da" stroke="#aab9cb"/><text x="540" y="1043" text-anchor="middle" font-size="23" font-weight="600">追加到前缀</text><text x="35" y="1210" font-size="17" fill="#475569">每次选出的token会成为下一轮条件；常规生成不是把整句话一次抽出来。</text></g></svg>
