<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>硬标签与软目标，信息差在哪？</title><rect width="1200" height="520" rx="20" fill="#faf7f1"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#252936"><text x="45" y="65" font-size="34" font-weight="700">硬标签与软目标，信息差在哪？</text><text x="45" y="108" font-size="18" fill="#696b75">编辑教学示意 · 按①②③看变化，再读下方解释</text><rect x="40" y="155" width="350" height="290" rx="15" fill="#e4edff"/><text x="62" y="202" font-size="23" font-weight="700">01 · 只给答案</text><text x="62" y="275" font-size="21">猫：正确答案</text><text x="62" y="335" font-size="21">学生只知道选哪一类</text><text x="400" y="308" font-size="28">→</text><rect x="430" y="155" width="350" height="290" rx="15" fill="#fff0d8"/><text x="452" y="202" font-size="23" font-weight="700">02 · 教师分布</text><text x="452" y="275" font-size="21">猫70% 狗20% 车10%</text><text x="452" y="335" font-size="21">也显示其他类别的相对关系</text><text x="790" y="308" font-size="28">→</text><rect x="820" y="155" width="350" height="290" rx="15" fill="#dff2e8"/><text x="842" y="202" font-size="23" font-weight="700">03 · 学生学习</text><text x="842" y="275" font-size="21">同时对照标签与教师分布</text><text x="842" y="335" font-size="21">传递行为，未复制整套记忆</text></g></svg>