<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{margin:0}svg{width:100%}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img"><title>多头注意力：并行分支，再拼接投影</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5c728c"/></marker></defs><rect width="1000" height="760" fill="#fafbfe"/><g font-family="PingFang SC,sans-serif"><text x="35" y="48" font-size="28" font-weight="700">多头：同一输入，并行走不同投影</text><g stroke="#5c728c" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M500 170V205H180V250"/><path d="M500 170V250"/><path d="M500 170V205H820V250"/><path d="M180 390V440H500V480"/><path d="M500 390V480"/><path d="M820 390V440H500V480"/><path d="M500 570V620"/></g><rect x="330" y="90" width="340" height="80" rx="12" fill="#e5edff"/><text x="500" y="124" text-anchor="middle" font-size="24">同一输入 X</text><text x="500" y="151" text-anchor="middle" font-size="18">例如：3个位置 × 8维</text><rect x="40" y="250" width="280" height="140" rx="12" fill="#e1f2e9"/><text x="180" y="285" text-anchor="middle" font-size="24" font-weight="600">头1</text><text x="180" y="321" text-anchor="middle" font-size="19">各自的Q / K / V投影</text><text x="180" y="356" text-anchor="middle" font-size="18">匹配 → softmax → 加权V</text><rect x="360" y="250" width="280" height="140" rx="12" fill="#e1f2e9"/><text x="500" y="285" text-anchor="middle" font-size="24" font-weight="600">头2</text><text x="500" y="321" text-anchor="middle" font-size="19">各自的Q / K / V投影</text><text x="500" y="356" text-anchor="middle" font-size="18">匹配 → softmax → 加权V</text><rect x="680" y="250" width="280" height="140" rx="12" fill="#e1f2e9"/><text x="820" y="285" text-anchor="middle" font-size="24" font-weight="600">头h</text><text x="820" y="321" text-anchor="middle" font-size="19">各自的Q / K / V投影</text><text x="820" y="356" text-anchor="middle" font-size="18">匹配 → softmax → 加权V</text><rect x="280" y="480" width="440" height="90" rx="12" fill="#fff0dc"/><text x="500" y="517" text-anchor="middle" font-size="24">Concat：拼接各头输出</text><text x="500" y="549" text-anchor="middle" font-size="18">例：2头各3×4 → 拼接3×8</text><rect x="280" y="620" width="440" height="85" rx="12" fill="#e5edff"/><text x="500" y="654" text-anchor="middle" font-size="24">输出投影 Wₒ</text><text x="500" y="685" text-anchor="middle" font-size="18">混合信息，回到模型所需维度</text><text x="35" y="740" font-size="17">上图画一般h头；尺寸例取h=2。各头并行，不是头1的输出送给头2。</text></g></svg>
