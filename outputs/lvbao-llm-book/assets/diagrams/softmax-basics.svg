<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" class="atlas-interactive-svg" style="width:100%;height:auto;display:block"><style>.atlas-diagram-node{cursor:pointer;outline:none}.atlas-diagram-node rect{transition:stroke .3s,fill .3s}.atlas-diagram-node:hover rect,.atlas-diagram-node:focus rect{stroke:#c8b7ff;stroke-width:2.5}.atlas-diagram-node.is-selected rect{fill:#3c2d60;stroke:#c4acff;stroke-width:2.5;filter:drop-shadow(0 0 9px #986dff55)}path[marker-end]{stroke-dasharray:10 6;animation:atlas-edge 3s linear infinite}@keyframes atlas-edge{to{stroke-dashoffset:-64}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect width="900" height="370" fill="#0d1223" /><g font-family="PingFang SC,sans-serif"><text x="30" y="45" font-size="27" fill="#d8e2fa">同一组候选：从分数变成份额</text><text x="40" y="100" font-size="21" fill="#d8e2fa">候选</text><text x="200" y="100" font-size="21" fill="#d8e2fa">分数</text><text x="370" y="100" font-size="21" fill="#d8e2fa">指数</text><text x="570" y="100" font-size="21" fill="#d8e2fa">除以总和11.107 → 概率</text><g class="atlas-diagram-node" data-node="0" tabindex="0" role="button" aria-label="候选 A：exp(2)≈7.389，除以总和得到 66.5%" data-title="候选 A" data-detail="exp(2)≈7.389，除以总和得到 66.5%"><rect x="30" y="128" width="840" height="42" rx="6" fill="#141b30" /><text x="45" y="160" font-size="24" fill="#d8e2fa">A</text><text x="210" y="160" font-size="24" fill="#d8e2fa">2</text><text x="370" y="160" font-size="24" fill="#d8e2fa">7.389</text><rect x="570" y="137" width="180" height="28" rx="3" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="760" y="160" font-size="20" fill="#d8e2fa">66.5%</text></g><g class="atlas-diagram-node" data-node="1" tabindex="0" role="button" aria-label="候选 B：exp(1)≈2.718，除以总和得到 24.5%" data-title="候选 B" data-detail="exp(1)≈2.718，除以总和得到 24.5%"><rect x="30" y="188" width="840" height="42" rx="6" fill="#141b30" /><text x="45" y="220" font-size="24" fill="#d8e2fa">B</text><text x="210" y="220" font-size="24" fill="#d8e2fa">1</text><text x="370" y="220" font-size="24" fill="#d8e2fa">2.718</text><rect x="570" y="197" width="66" height="28" rx="3" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="646" y="220" font-size="20" fill="#d8e2fa">24.5%</text></g><g class="atlas-diagram-node" data-node="2" tabindex="0" role="button" aria-label="候选 C：exp(0)=1，除以总和得到 9.0%" data-title="候选 C" data-detail="exp(0)=1，除以总和得到 9.0%"><rect x="30" y="248" width="840" height="42" rx="6" fill="#141b30" /><text x="45" y="280" font-size="24" fill="#d8e2fa">C</text><text x="210" y="280" font-size="24" fill="#d8e2fa">0</text><text x="370" y="280" font-size="24" fill="#d8e2fa">1.000</text><rect x="570" y="257" width="24" height="28" rx="3" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="604" y="280" font-size="20" fill="#d8e2fa">9.0%</text></g><text x="35" y="340" font-size="20" fill="#d8e2fa">三项合计100%；先形成概率，再由解码规则决定怎样选择。</text></g></svg>