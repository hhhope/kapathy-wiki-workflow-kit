<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1300" role="img"><title>保留旧能力与主动遗忘不同</title><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59718a"/></marker></defs><rect width="1080" height="1300" fill="#fafbfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="48" font-size="27" font-weight="700">保留旧能力与主动遗忘不同</text><text x="35" y="82" font-size="17" fill="#64748b">先看每个部件，再沿标注箭头读依赖；布局位置不表示所有部件串行执行。</text><path d="M540 230V310" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="275.0" font-size="16" fill="#43586d">训练留下影响</text><path d="M540 400V480" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="445.0" font-size="16" fill="#43586d">继续学习</text><path d="M750 695H810V525H750" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="760" y="680" font-size="16" fill="#43586d">限制重要参数偏移</text><path d="M330 355H120V1035H330" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="128" y="380" font-size="16" fill="#43586d">遗忘操作</text><path d="M540 910V990" fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#ar)"/><text x="555" y="955.0" font-size="16" fill="#43586d">确定移除目标</text><rect x="330" y="140" width="420" height="90" rx="12" fill="#e6eefb" stroke="#aab9cb"/><text x="540" y="193" text-anchor="middle" font-size="23" font-weight="600">旧任务数据</text><rect x="330" y="310" width="420" height="90" rx="12" fill="#e2f2e9" stroke="#aab9cb"/><text x="540" y="363" text-anchor="middle" font-size="23" font-weight="600">参数θ已受影响</text><rect x="330" y="480" width="420" height="90" rx="12" fill="#fff0da" stroke="#aab9cb"/><text x="540" y="533" text-anchor="middle" font-size="23" font-weight="600">新任务训练</text><rect x="330" y="650" width="420" height="90" rx="12" fill="#e6eefb" stroke="#aab9cb"/><text x="540" y="703" text-anchor="middle" font-size="23" font-weight="600">保护旧任务的重要参数</text><rect x="330" y="820" width="420" height="90" rx="12" fill="#e2f2e9" stroke="#aab9cb"/><text x="540" y="873" text-anchor="middle" font-size="23" font-weight="600">指定要移除的数据</text><rect x="330" y="990" width="420" height="90" rx="12" fill="#fff0da" stroke="#aab9cb"/><text x="540" y="1043" text-anchor="middle" font-size="23" font-weight="600">遗忘后模型与验收</text><text x="35" y="1210" font-size="17" fill="#475569">上方学习可能造成意外遗忘；主动遗忘是另一个目标。只删原始文件不能直接擦掉参数影响。</text></g></svg>