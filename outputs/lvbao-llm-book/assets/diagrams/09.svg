<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>奖励来得晚，前面步骤怎么计功？</title><rect width="1200" height="520" rx="20" fill="#faf7f1"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#252936"><text x="45" y="65" font-size="34" font-weight="700">奖励来得晚，前面步骤怎么计功？</text><text x="45" y="108" font-size="18" fill="#696b75">编辑教学示意 · 按①②③看变化，再读下方解释</text><rect x="40" y="155" width="350" height="290" rx="15" fill="#e4edff"/><text x="62" y="202" font-size="23" font-weight="700">01 · 动作1</text><text x="62" y="275" font-size="21">找准杯子位置</text><text x="62" y="335" font-size="21">当下奖励=0</text><text x="400" y="308" font-size="28">→</text><rect x="430" y="155" width="350" height="290" rx="15" fill="#fff0d8"/><text x="452" y="202" font-size="23" font-weight="700">02 · 动作2</text><text x="452" y="275" font-size="21">收紧手指，拿稳杯子</text><text x="452" y="335" font-size="21">随后奖励=10</text><text x="790" y="308" font-size="28">→</text><rect x="820" y="155" width="350" height="290" rx="15" fill="#dff2e8"/><text x="842" y="202" font-size="23" font-weight="700">03 · 回看动作1</text><text x="842" y="275" font-size="21">若γ=0.9，γ²×10=8.1</text><text x="842" y="335" font-size="21">未来奖励也能进入当前回报</text></g></svg>