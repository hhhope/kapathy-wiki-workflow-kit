<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">涅槃与最新项目入口重绘</title>
  <desc id="desc">基于涅槃现状、最终方案、优化后图示、清算内容和分账核心改造报告重绘。</desc>
  <defs>
    <style>
      @font-face{font-family:YaHeiLocal;src:url("file:///mnt/c/Windows/Fonts/msyh.ttc") format("truetype")}.bg{fill:#fffaf0}.title{font:800 36px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#141414}.sub{font:600 16px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#5b6472}.panel{fill:#fff;stroke:#141414;stroke-width:3}.bad{fill:#fee2e2;stroke:#ef4444;stroke-width:2.5}.new{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.mod{fill:#fef3c7;stroke:#f59e0b;stroke-width:2.5}.acct{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.clear{fill:#ede9fe;stroke:#7c3aed;stroke-width:2.5}.work{fill:#f8fafc;stroke:#334155;stroke-width:2.5}.h{font:800 24px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#141414}.txt{font:800 17px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#141414}.small{font:600 13px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#475569}.tiny{font:600 12px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#64748b}.arrow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.blueArrow{fill:none;stroke:#0284c7;stroke-width:3;marker-end:url(#blueArrow)}.redArrow{fill:none;stroke:#ef4444;stroke-width:3;marker-end:url(#redArrow);stroke-dasharray:8 6}.laneLabel{font:800 18px YaHeiLocal,"Microsoft YaHei",Arial,sans-serif;fill:#111827}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L12 4.5L0 9Z" fill="#334155"/></marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L12 4.5L0 9Z" fill="#0284c7"/></marker>
    <marker id="redArrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L12 4.5L0 9Z" fill="#ef4444"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1080"/>
  <text x="58" y="70" class="title">涅槃与最新项目：账户组新人从哪里进入真实工作</text>
  <text x="58" y="106" class="sub">这张图把“现状烟囱化 -> 涅槃目标架构 -> 清算/账户服务关系 -> 最新研发投入入口”放在一页。</text>

  <rect class="panel" x="52" y="140" width="460" height="360" rx="24"/>
  <text x="84" y="184" class="h">现状压力：烟囱化和链路割裂</text>
  <rect class="bad" x="84" y="220" width="170" height="58" rx="12"/><text x="169" y="255" class="txt" text-anchor="middle">协议支付</text>
  <rect class="bad" x="300" y="220" width="170" height="58" rx="12"/><text x="385" y="255" class="txt" text-anchor="middle">网银 / 聚合</text>
  <rect class="bad" x="84" y="300" width="170" height="58" rx="12"/><text x="169" y="335" class="txt" text-anchor="middle">宝财通</text>
  <rect class="bad" x="300" y="300" width="170" height="58" rx="12"/><text x="385" y="335" class="txt" text-anchor="middle">宝户通 / 银企云</text>
  <rect class="bad" x="84" y="382" width="386" height="54" rx="12"/><text x="277" y="416" class="txt" text-anchor="middle">入口、账户、清结算、对账各自实现</text>
  <text x="84" y="462" class="small">新人不能只背系统名，要看重复能力、账户关系和清算结果怎么被拆散。</text>

  <rect class="panel" x="570" y="140" width="978" height="360" rx="24"/>
  <text x="602" y="184" class="h">目标方案：统一入口 + 收单核心 + 账户中心 + 清结算</text>
  <rect class="new" x="602" y="220" width="400" height="58" rx="12"/><text x="802" y="255" class="txt" text-anchor="middle">统一网关：H5 / API / 通知中心</text>
  <rect class="mod" x="602" y="310" width="210" height="74" rx="12"/><text x="707" y="340" class="txt" text-anchor="middle">收单核心 fi-hub</text><text x="707" y="365" class="small" text-anchor="middle">组合支付 / 签约 / 二次支付</text>
  <rect class="mod" x="840" y="310" width="170" height="74" rx="12"/><text x="925" y="340" class="txt" text-anchor="middle">query-hub</text><text x="925" y="365" class="small" text-anchor="middle">订单查询</text>
  <rect class="mod" x="1038" y="310" width="170" height="74" rx="12"/><text x="1123" y="340" class="txt" text-anchor="middle">fi-route</text><text x="1123" y="365" class="small" text-anchor="middle">支付/绑卡路由</text>
  <rect class="acct" x="1236" y="220" width="252" height="76" rx="12"/><text x="1362" y="250" class="txt" text-anchor="middle">账户中心</text><text x="1362" y="275" class="small" text-anchor="middle">个人户 / 电子户 / 记账户</text>
  <rect class="clear" x="1236" y="320" width="252" height="76" rx="12"/><text x="1362" y="350" class="txt" text-anchor="middle">清结算</text><text x="1362" y="375" class="small" text-anchor="middle">清分 / 结算 / 分润 / 收费</text>
  <rect class="new" x="1236" y="420" width="252" height="54" rx="12"/><text x="1362" y="454" class="txt" text-anchor="middle">认证渠道 / 风控</text>
  <path class="arrow" d="M802 278V310"/><path class="arrow" d="M1002 249H1236"/><path class="arrow" d="M1123 384C1170 405 1200 430 1236 447"/>

  <rect class="panel" x="52" y="540" width="705" height="340" rx="24"/>
  <text x="84" y="584" class="h">清算内容：账户服务到核心账本的关系</text>
  <text x="92" y="640" class="laneLabel">业务系统</text>
  <rect class="new" x="220" y="610" width="130" height="50" rx="10"/><text x="285" y="641" class="txt" text-anchor="middle">CDP</text>
  <rect class="mod" x="530" y="610" width="130" height="50" rx="10"/><text x="595" y="641" class="txt" text-anchor="middle">fi-hub</text>
  <text x="92" y="718" class="laneLabel">账户服务</text>
  <rect class="new" x="210" y="690" width="150" height="52" rx="10"/><text x="285" y="722" class="txt" text-anchor="middle">account-gateway</text>
  <rect class="mod" x="520" y="690" width="150" height="52" rx="10"/><text x="595" y="722" class="txt" text-anchor="middle">facade</text>
  <text x="92" y="798" class="laneLabel">账户核心</text>
  <rect class="acct" x="165" y="770" width="125" height="50" rx="10"/><text x="228" y="800" class="small" text-anchor="middle">ma-service</text>
  <rect class="acct" x="320" y="770" width="125" height="50" rx="10"/><text x="383" y="800" class="small" text-anchor="middle">cloud-account</text>
  <rect class="acct" x="475" y="770" width="125" height="50" rx="10"/><text x="538" y="800" class="small" text-anchor="middle">yqy-account</text>
  <rect class="clear" x="620" y="770" width="105" height="50" rx="10"/><text x="672" y="800" class="small" text-anchor="middle">yqy-clear</text>
  <path class="blueArrow" d="M285 660V690"/><path class="redArrow" d="M595 660V690"/>
  <path class="blueArrow" d="M285 742L228 770"/><path class="blueArrow" d="M285 742L383 770"/><path class="blueArrow" d="M285 742L538 770"/>
  <path class="redArrow" d="M595 742L672 770"/><path class="redArrow" d="M595 742C640 735 685 730 720 710"/>

  <rect class="panel" x="795" y="540" width="753" height="340" rx="24"/>
  <text x="827" y="584" class="h">最新项目入口：新人能做什么、能获得什么</text>
  <rect class="work" x="827" y="620" width="210" height="82" rx="14"/><text x="932" y="650" class="txt" text-anchor="middle">宝财通 / 二级商户</text><text x="932" y="676" class="small" text-anchor="middle">会员号、客户号、账户关系</text>
  <rect class="work" x="1065" y="620" width="210" height="82" rx="14"/><text x="1170" y="650" class="txt" text-anchor="middle">结算 / 出款 / 清算</text><text x="1170" y="676" class="small" text-anchor="middle">提现、代付、清算接口</text>
  <rect class="work" x="1303" y="620" width="210" height="82" rx="14"/><text x="1408" y="650" class="txt" text-anchor="middle">对账 / 报表联调</text><text x="1408" y="676" class="small" text-anchor="middle">商户对账、报表口径</text>
  <rect class="work" x="827" y="735" width="210" height="82" rx="14"/><text x="932" y="765" class="txt" text-anchor="middle">余额 / 账本验证</text><text x="932" y="791" class="small" text-anchor="middle">可用、实时、冻结、记账</text>
  <rect class="work" x="1065" y="735" width="210" height="82" rx="14"/><text x="1170" y="765" class="txt" text-anchor="middle">账户模型收敛</text><text x="1170" y="791" class="small" text-anchor="middle">母子账户、多账户模型</text>
  <rect class="work" x="1303" y="735" width="210" height="82" rx="14"/><text x="1408" y="765" class="txt" text-anchor="middle">银行 / 渠道连接</text><text x="1408" y="791" class="small" text-anchor="middle">通道回执、银行账户</text>

  <g transform="translate(58 922)">
    <rect class="panel" width="1490" height="92" rx="22"/>
    <text x="28" y="36" class="txt">给新人看的结论：</text>
    <text x="190" y="36" class="small">涅槃不是另一个项目名，而是把入口、交易、账户、清结算、对账从烟囱里拆出来重新接稳。</text>
    <text x="190" y="66" class="small">你能从字段校验、联调验证、账本/余额证明、清算回执、对账差异和复盘沉淀进入真实工程现场。</text>
  </g>
</svg>
