<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1300" role="img" class="atlas-interactive-svg" style="width:100%;height:auto;display:block"><style>.atlas-diagram-node{cursor:pointer;outline:none}.atlas-diagram-node rect{transition:stroke .3s,fill .3s}.atlas-diagram-node:hover rect,.atlas-diagram-node:focus rect{stroke:#c8b7ff;stroke-width:2.5}.atlas-diagram-node.is-selected rect{fill:#3c2d60;stroke:#c4acff;stroke-width:2.5;filter:drop-shadow(0 0 9px #986dff55)}path[marker-end]{stroke-dasharray:10 6;animation:atlas-edge 3s linear infinite}@keyframes atlas-edge{to{stroke-dashoffset:-64}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><title>从文字到向量的查表路径</title><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59718a" /></marker></defs><rect width="1080" height="1300" fill="#0d1223" /><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="48" font-size="27" font-weight="700" fill="#d8e2fa">从文字到向量的查表路径</text><text x="35" y="82" font-size="17" fill="#d8e2fa">先看每个部件，再沿标注箭头读依赖；布局位置不表示所有部件串行执行。</text><path d="M540 230V310" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="555" y="275.0" font-size="16" fill="#d8e2fa">切分</text><path d="M540 400V480" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="555" y="445.0" font-size="16" fill="#d8e2fa">编号</text><path d="M330 525H120V865H330" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="128" y="550" font-size="16" fill="#d8e2fa">行索引</text><path d="M540 740V820" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="555" y="785.0" font-size="16" fill="#d8e2fa">参数表</text><path d="M540 910V990" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="555" y="955.0" font-size="16" fill="#d8e2fa">查表</text><g class="atlas-diagram-node" data-node="0" tabindex="0" role="button" aria-label="文字：今天天气很"><rect x="330" y="140" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="193" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">文字：今天天气很</text></g><g class="atlas-diagram-node" data-node="1" tabindex="0" role="button" aria-label="片段：今天/天气/很"><rect x="330" y="310" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="363" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">片段：今天/天气/很</text></g><g class="atlas-diagram-node" data-node="2" tabindex="0" role="button" aria-label="ID：[7,12,5]"><rect x="330" y="480" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="533" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">ID：[7,12,5]</text></g><g class="atlas-diagram-node" data-node="3" tabindex="0" role="button" aria-label="嵌入表 E"><rect x="330" y="650" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="703" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">嵌入表 E</text></g><g class="atlas-diagram-node" data-node="4" tabindex="0" role="button" aria-label="取第7、12、5行"><rect x="330" y="820" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="873" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">取第7、12、5行</text></g><g class="atlas-diagram-node" data-node="5" tabindex="0" role="button" aria-label="向量序列：3×d"><rect x="330" y="990" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="1043" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">向量序列：3×d</text></g><text x="35" y="1210" font-size="17" fill="#d8e2fa">把ID当行号，沿箭头找到向量。编号的差值不参与语义距离计算。</text></g></svg>