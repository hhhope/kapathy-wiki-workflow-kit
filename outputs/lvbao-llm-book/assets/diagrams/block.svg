<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img"><title>一个常见的Pre-Norm decoder块（从上往下读）</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4b6584"/></marker></defs><rect width="1000" height="760" fill="#fafbfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="47" font-size="26" font-weight="700">一个常见的Pre-Norm decoder块（从上往下读）</text><path d="M500 172 L500 210" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M500 292 L500 340" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M500 422 L500 470" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M500 552 L500 600" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M180 130 L180 380" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><text x="188.0" y="247.0" font-size="15" fill="#556">原输入旁路</text><path d="M180 380 L290 380" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><text x="243.0" y="372.0" font-size="15" fill="#556">＋</text><path d="M820 380 L820 640" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><text x="828.0" y="502.0" font-size="15" fill="#556">第二条旁路</text><path d="M820 640 L710 640" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><text x="773.0" y="632.0" font-size="15" fill="#556">＋</text><path d="M290 130 L180 130" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><path d="M710 380 L820 380" fill="none" stroke="#4b6584" stroke-width="2" marker-end="url(#arr)"/><rect x="290" y="90" width="420" height="82" rx="10" fill="#e5edff" stroke="#a8b6c9"/><text x="500.0" y="122" text-anchor="middle" font-size="21" font-weight="600">输入 X</text><text x="500.0" y="149" text-anchor="middle" font-size="16">T×d：T个位置，每个d维</text><rect x="290" y="210" width="420" height="82" rx="10" fill="#e2f3eb" stroke="#a8b6c9"/><text x="500.0" y="242" text-anchor="middle" font-size="21" font-weight="600">归一化 → 因果多头自注意力</text><text x="500.0" y="269" text-anchor="middle" font-size="16">只能聚合当前位置及以前的信息</text><rect x="290" y="340" width="420" height="82" rx="10" fill="#fff0dc" stroke="#a8b6c9"/><text x="500.0" y="372" text-anchor="middle" font-size="21" font-weight="600">残差相加：X＋Attention输出</text><text x="500.0" y="399" text-anchor="middle" font-size="16">旁路把原输入加回来</text><rect x="290" y="470" width="420" height="82" rx="10" fill="#e2f3eb" stroke="#a8b6c9"/><text x="500.0" y="502" text-anchor="middle" font-size="21" font-weight="600">归一化 → 前馈网络 FFN</text><text x="500.0" y="529" text-anchor="middle" font-size="16">逐位置加工；内部可先扩维再投回d</text><rect x="290" y="600" width="420" height="82" rx="10" fill="#fff0dc" stroke="#a8b6c9"/><text x="500.0" y="632" text-anchor="middle" font-size="21" font-weight="600">第二次残差相加 → 输出</text><text x="500.0" y="659" text-anchor="middle" font-size="16">仍是T×d，送进下一个块</text><text x="35" y="720" font-size="17" fill="#556">教学简化：现代模型有不同归一化与位置方案；这不是2017原始编码器—解码器原图。</text></g></svg>