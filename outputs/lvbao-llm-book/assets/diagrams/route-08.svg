<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1300" role="img" class="atlas-interactive-svg" style="width:100%;height:auto;display:block"><style>.atlas-diagram-node{cursor:pointer;outline:none}.atlas-diagram-node rect{transition:stroke .3s,fill .3s}.atlas-diagram-node:hover rect,.atlas-diagram-node:focus rect{stroke:#c8b7ff;stroke-width:2.5}.atlas-diagram-node.is-selected rect{fill:#3c2d60;stroke:#c4acff;stroke-width:2.5;filter:drop-shadow(0 0 9px #986dff55)}path[marker-end]{stroke-dasharray:10 6;animation:atlas-edge 3s linear infinite}@keyframes atlas-edge{to{stroke-dashoffset:-64}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><title>蒸馏的双重学习信号</title><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59718a" /></marker></defs><rect width="1080" height="1300" fill="#0d1223" /><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="48" font-size="27" font-weight="700" fill="#d8e2fa">蒸馏的双重学习信号</text><text x="35" y="82" font-size="17" fill="#d8e2fa">先看每个部件，再沿标注箭头读依赖；布局位置不表示所有部件串行执行。</text><path d="M540 230V310" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="555" y="275.0" font-size="16" fill="#d8e2fa">前向</text><path d="M330 185H120V525H330" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="128" y="210" font-size="16" fill="#d8e2fa">前向</text><path d="M330 355H162V695H330" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="170" y="380" font-size="16" fill="#d8e2fa">提供目标</text><path d="M330 695H204V1035H330" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="212" y="720" font-size="16" fill="#d8e2fa">与学生分布比较</text><path d="M330 525H246V1035H330" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="254" y="550" font-size="16" fill="#d8e2fa">学生分布</text><path d="M330 525H288V865H330" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="296" y="550" font-size="16" fill="#d8e2fa">与真实标签比较</text><path d="M540 910V990" fill="none" stroke="#9d8de0" stroke-width="2" marker-end="url(#ar)" /><text x="555" y="955.0" font-size="16" fill="#d8e2fa">共同训练学生</text><g class="atlas-diagram-node" data-node="0" tabindex="0" role="button" aria-label="训练输入"><rect x="330" y="140" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="193" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">训练输入</text></g><g class="atlas-diagram-node" data-node="1" tabindex="0" role="button" aria-label="固定教师模型"><rect x="330" y="310" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="363" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">固定教师模型</text></g><g class="atlas-diagram-node" data-node="2" tabindex="0" role="button" aria-label="学生模型"><rect x="330" y="480" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="533" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">学生模型</text></g><g class="atlas-diagram-node" data-node="3" tabindex="0" role="button" aria-label="教师软目标分布"><rect x="330" y="650" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="703" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">教师软目标分布</text></g><g class="atlas-diagram-node" data-node="4" tabindex="0" role="button" aria-label="真实标签损失"><rect x="330" y="820" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="873" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">真实标签损失</text></g><g class="atlas-diagram-node" data-node="5" tabindex="0" role="button" aria-label="加权总损失"><rect x="330" y="990" width="420" height="90" rx="12" fill="#20283e" stroke="#7770a9" stroke-width="1.2" /><text x="540" y="1043" text-anchor="middle" font-size="23" font-weight="600" fill="#d8e2fa">加权总损失</text></g><text x="35" y="1210" font-size="17" fill="#d8e2fa">教师提供分布，学生接受更新；此图不表示教师参数被复制进学生。</text></g></svg>